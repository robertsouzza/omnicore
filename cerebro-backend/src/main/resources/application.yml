server:
  port: 8080
  tomcat:
    threads:
      max: 200 # Limite do Tomcat, mas que rodará leve com Virtual Threads

spring:
  application:
    name: cerebro-backend

  # Ativa os Virtual Threads nativos do Java 21 no Spring Boot 3.5+
  threads:
    virtual:
      enabled: true

  # Configuração de Conexão com o Banco do Docker
  datasource:
    url: jdbc:postgresql://localhost:5432/omnicore_management
    username: admin
    password: omnicore_secret_pass
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: OmniCore-HikariCP
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000

# Configuração do Hibernate / JPA
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update # Cria e atualiza as tabelas automaticamente baseado nas nossas Entities
    show-sql: true # Mostra os SQLs gerados no terminal (ótimo para desenvolvimento)
    properties:
      "[hibernate.format_sql]": true # Deixa o SQL do terminal indentado e legível

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

# Configuração do Swagger / OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: alpha # Organiza os endpoints por ordem alfabética

omnicore:
  jwt:
    secret: ${JWT_SECRET:omnicore-dev-secret-key-com-minimo-32-caracteres}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  storage:
    enabled: ${STORAGE_ENABLED:true}
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    access-key: ${STORAGE_ACCESS_KEY:minioadmin}
    secret-key: ${STORAGE_SECRET_KEY:minioadmin}
    bucket: ${STORAGE_BUCKET:omnicore-produtos}
    public-base-url: ${STORAGE_PUBLIC_BASE_URL:http://localhost:9000/omnicore-produtos}
    max-file-size-bytes: 5242880